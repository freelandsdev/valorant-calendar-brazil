name: Atualizar Calendário

on:
  schedule:
    # Executa diariamente às 01:00 horário de Brasília (04:00 UTC)
    # Horário escolhido para ser após o término dos últimos jogos do dia (geralmente até 23h)
    # Apenas 1 execução por dia para evitar bloqueio por automação
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite execução manual

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    environment: github-pages
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Executar script de atualização
      env:
        CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: |
        python index.py
